<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Geolocation - Project 40</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="info-panel">
            <h1>IP Geolocation</h1>
            <p>Lokasi Anda saat ini berdasarkan alamat IP:</p>
            
            <div id="stats" class="stats">
                <div class="stat-item">
                    <span class="label">Alamat IP</span>
                    <p id="user-ip">Mendapatkan data...</p>
                </div>
                <div class="stat-item">
                    <span class="label">Lokasi</span>
                    <p id="user-location">--</p>
                </div>
                <div class="stat-item">
                    <span class="label">ISP</span>
                    <p id="user-isp">--</p>
                </div>
            </div>
            
            <button id="refresh-btn">Refresh Data</button>
        </div>

        <div id="map" class="map-container"></div>

        <footer class="project-footer">
            Project 40 / 100 &mdash; IP Geolocation
        </footer>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="script.js"></script>
</body>
</html>
