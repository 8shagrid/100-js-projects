<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech to Text - Project 63</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Voice Dictation</h1>
            <p>Ubah ucapan Anda menjadi teks secara instan</p>
        </header>

        <div class="dictation-card">
            <div class="mic-container">
                <button id="start-btn" class="mic-btn">
                    <div class="pulse-ring"></div>
                    <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </button>
                <div id="status" class="status-indicator">Siap untuk mendengarkan</div>
            </div>

            <textarea id="output-text" placeholder="Hasil transkripsi akan muncul di sini..."></textarea>

            <div class="controls">
                <button id="copy-btn" class="btn">Salin Teks</button>
                <button id="clear-btn" class="btn secondary">Hapus</button>
            </div>
        </div>

        <footer class="project-footer">
            Project 63 / 100 &mdash; Speech Recognition API
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
