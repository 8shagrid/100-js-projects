<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sine Wave Graph - Project 57</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Visualisasi Gelombang Sinus</h1>
            <p>Eksperimen matematika dengan Canvas API</p>
        </header>

        <div class="canvas-wrapper">
            <canvas id="waveCanvas"></canvas>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>Amplitudo: <span id="amp-val">50</span></label>
                <input type="range" id="amplitude" min="10" max="150" value="50">
            </div>
            <div class="control-group">
                <label>Frekuensi: <span id="freq-val">0.02</span></label>
                <input type="range" id="frequency" min="0.001" max="0.1" step="0.001" value="0.02">
            </div>
            <div class="control-group">
                <label>Kecepatan: <span id="speed-val">0.05</span></label>
                <input type="range" id="speed" min="0.01" max="0.3" step="0.01" value="0.05">
            </div>
        </div>

        <footer class="project-footer">
            Project 57 / 100 &mdash; Graph Sine Wave
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
