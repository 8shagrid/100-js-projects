<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer - Project 20</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Countdown Timer</h1>
        <p>Atur waktu (Menit & Detik):</p>
        
        <div class="input-container">
            <input type="number" id="minutes-input" placeholder="Min" min="0" max="99" value="0">
            <span>:</span>
            <input type="number" id="seconds-input" placeholder="Sec" min="0" max="59" value="0">
        </div>

        <div class="display" id="display">00:00</div>
        
        <div class="controls">
            <button class="btn start" id="start">Start</button>
            <button class="btn pause" id="pause">Pause</button>
            <button class="btn reset" id="reset">Reset</button>
        </div>

        <footer class="project-footer">
            Project 20 / 100 &mdash; Countdown Timer
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
