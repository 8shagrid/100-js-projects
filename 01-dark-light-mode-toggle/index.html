<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark/Light Mode Toggle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>🌓 Dark / Light Mode</h1>
    <p>Klik toggle – tema akan tersimpan otomatis</p>

    <div class="toggle-container">
      <span class="icon">☀️</span>
      <label class="toggle">
        <input type="checkbox" id="themeToggle">
        <span class="slider"></span>
      </label>
      <span class="icon">🌙</span>
    </div>


  </div>

  <script src="script.js"></script>

    <footer style="margin-top: 2rem; border-top: 1px solid #eee; padding-top: 1rem; text-align: center; font-size: 0.9rem; color: #666; font-family: sans-serif;">Project 01 / 100 &mdash; Dark Light Mode Toggle</footer>
</body>
</html>
