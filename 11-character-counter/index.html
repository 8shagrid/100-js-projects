<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter - Project 11</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Character Counter</h1>
        <p>Ketik sesuatu untuk menghitung karakter:</p>
        
        <textarea id="textarea" placeholder="Tulis pesan Anda di sini..." maxlength="200"></textarea>
        
        <div class="counter-container">
            <p>Total Karakter: <span id="total-counter">0</span></p>
            <p>Sisa Karakter: <span id="remaining-counter">200</span></p>
        </div>

        <footer class="project-footer">
            Project 11 / 100 &mdash; Character Counter
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
