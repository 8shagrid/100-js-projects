<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Digital Clock - Project 56</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="clock-card">
            <div class="top-row">
                <span id="day-name">Senin</span>, <span id="full-date">05 Mei 2026</span>
            </div>
            
            <div class="time-row">
                <span id="hours">00</span>
                <span class="colon">:</span>
                <span id="minutes">00</span>
                <span class="colon">:</span>
                <span id="seconds">00</span>
                <span id="ampm" class="ampm">AM</span>
            </div>

            <div class="controls">
                <button id="format-toggle">Format: 24H</button>
            </div>
        </div>

        <footer class="project-footer">
            Project 56 / 100 &mdash; Digital Clock
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
