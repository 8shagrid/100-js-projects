<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter - Project 35</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="converter-card">
            <h1>Konverter Mata Uang</h1>
            <p>Dapatkan nilai tukar real-time di bawah ini:</p>
            
            <div class="flex-container">
                <div class="form-control">
                    <label>Jumlah</label>
                    <input type="number" id="amount" value="1" min="1">
                </div>
            </div>

            <div class="flex-container">
                <div class="form-control">
                    <label>Dari</label>
                    <select id="from-currency">
                        <!-- Populated by JS -->
                    </select>
                </div>
                <button class="swap-btn" id="swap-btn">⇅</button>
                <div class="form-control">
                    <label>Ke</label>
                    <select id="to-currency">
                        <!-- Populated by JS -->
                    </select>
                </div>
            </div>

            <div class="result-area">
                <p id="rate-text">Memuat nilai tukar...</p>
                <h2 id="total-text">--</h2>
            </div>
        </div>

        <footer class="project-footer">
            Project 35 / 100 &mdash; Currency Converter
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
