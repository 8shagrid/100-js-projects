<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Counter - Project 12</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Word Counter</h1>
        <p>Tulis atau tempel teks Anda untuk dianalisis:</p>
        
        <textarea id="textarea" placeholder="Mulai menulis di sini..."></textarea>
        
        <div class="stats">
            <div class="stat-item">
                <span class="stat-number" id="word-count">0</span>
                <span class="stat-label">Words</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="char-count">0</span>
                <span class="stat-label">Characters</span>
            </div>
        </div>

        <footer class="project-footer">
            Project 12 / 100 &mdash; Word Counter
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
