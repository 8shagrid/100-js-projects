<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search - Project 38</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <form id="search-form" class="search-form">
            <input type="text" id="movie-input" placeholder="Cari Judul Film..." autocomplete="off">
            <button id="search-btn">Cari</button>
        </form>

        <div id="movie-card" class="movie-card">
            <!-- Results populated by JS -->
            <div class="initial-msg">Masukkan judul film untuk melihat detail.</div>
        </div>

        <footer class="project-footer">
            Project 38 / 100 &mdash; Movie Search
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
