<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag and Drop List - Project 09</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Drag and Drop List</h1>
        <p>Urutkan item sesukamu:</p>
        
        <ul class="draggable-list" id="draggable-list">
            <li class="draggable" draggable="true">
                <span class="number">1</span>
                <span class="text">Projek Web Design</span>
                <span class="handle">&#9776;</span>
            </li>
            <li class="draggable" draggable="true">
                <span class="number">2</span>
                <span class="text">Belajar Javascript Dasar</span>
                <span class="handle">&#9776;</span>
            </li>
            <li class="draggable" draggable="true">
                <span class="number">3</span>
                <span class="text">Persiapan Portofolio</span>
                <span class="handle">&#9776;</span>
            </li>
            <li class="draggable" draggable="true">
                <span class="number">4</span>
                <span class="text">Latihan Algoritma</span>
                <span class="handle">&#9776;</span>
            </li>
            <li class="draggable" draggable="true">
                <span class="number">5</span>
                <span class="text">Deploy Aplikasi</span>
                <span class="handle">&#9776;</span>
            </li>
        </ul>

        <footer class="project-footer">
            Project 09 / 100 &mdash; Drag and Drop List
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
