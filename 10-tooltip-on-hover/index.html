<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip on Hover - Project 10</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Custom Tooltips</h1>
        <p>Arahkan kursor ke ikon di bawah ini:</p>
        
        <div class="icons-grid">
            <div class="icon-item" data-tooltip="Kirim Pesan">📩</div>
            <div class="icon-item" data-tooltip="Pengaturan Akun">⚙️</div>
            <div class="icon-item" data-tooltip="Lihat Notifikasi">🔔</div>
            <div class="icon-item" data-tooltip="Keluar Sistem">🚪</div>
        </div>

        <div id="tooltip" class="tooltip">Isi Tooltip</div>

        <footer class="project-footer">
            Project 10 / 100 &mdash; Tooltip on Hover
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
