<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Popup Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button class="btn-open" id="openModalBtn">Buka Modal</button>

    <div class="modal-backdrop" id="modalBackdrop">
        <div class="modal-content">
            <h2 class="modal-title">Halo!</h2>
            <p class="modal-text">Ini adalah contoh modal popup. Kamu bisa menutupnya dengan menekan tombol Tutup, atau cukup klik area gelap di luar kotak putih ini.</p>
            <button class="btn-close" id="closeModalBtn">Tutup Modal</button>
        </div>
    </div>

    <script src="script.js"></script>

    <footer style="margin-top: 2rem; border-top: 1px solid #eee; padding-top: 1rem; text-align: center; font-size: 0.9rem; color: #666; font-family: sans-serif;">Project 03 / 100 &mdash; Modal Popup</footer>
</body>
</html>
