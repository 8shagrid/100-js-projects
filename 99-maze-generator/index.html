<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maze Generator | 100 JS Projects #99</title>
  <meta name="description" content="Interactive maze generator using recursive backtracking algorithm with animated generation and pathfinding solver." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d1a;
      --surface: #13132b;
      --surface2: #1a1a38;
      --border: #2a2a55;
      --accent: #7c3aed;
      --accent2: #06b6d4;
      --accent3: #10b981;
      --danger: #f43f5e;
      --text: #e2e8f0;
      --muted: #64748b;
      --wall: #1e1b4b;
      --path: #0d0d1a;
      --visited: #312e81;
      --solution: #7c3aed;
      --start: #10b981;
      --end: #f43f5e;
      --current: #fbbf24;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(124,58,237,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(6,182,212,0.06) 0%, transparent 60%);
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    .badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      font-size: 11px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 1.5px;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
    }

    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 700px;
    }

    /* Controls */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 120px;
    }

    .control-group label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .control-group select,
    .control-group input[type="range"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      padding: 7px 10px;
      cursor: pointer;
      transition: border-color 0.2s;
      width: 100%;
    }

    .control-group select:focus { outline: none; border-color: var(--accent); }

    .control-group input[type="range"] {
      padding: 0;
      height: 34px;
      -webkit-appearance: none;
      background: transparent;
    }
    .control-group input[type="range"]::-webkit-slider-runnable-track {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      height: 6px;
    }
    .control-group input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      margin-top: -7px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .control-group input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

    .range-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--accent2);
      font-weight: 600;
    }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      width: 100%;
    }

    button {
      flex: 1;
      min-width: 100px;
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #9333ea);
      color: white;
      box-shadow: 0 4px 20px rgba(124,58,237,0.35);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(124,58,237,0.5); }
    .btn-primary:active { transform: translateY(0); }

    .btn-teal {
      background: linear-gradient(135deg, var(--accent2), #0891b2);
      color: white;
      box-shadow: 0 4px 20px rgba(6,182,212,0.25);
    }
    .btn-teal:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(6,182,212,0.4); }

    .btn-green {
      background: linear-gradient(135deg, var(--accent3), #059669);
      color: white;
      box-shadow: 0 4px 20px rgba(16,185,129,0.25);
    }
    .btn-green:hover { transform: translateY(-1px); }

    .btn-ghost {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--surface2); color: var(--text); }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    /* Canvas wrapper */
    .canvas-wrapper {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow:
        0 0 0 1px rgba(124,58,237,0.15),
        0 20px 60px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.04);
      background: var(--surface);
    }

    canvas {
      display: block;
    }

    /* Status */
    .status-bar {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .status-text {
      font-size: 13px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
    }
    .status-dot.running { background: var(--current); animation: pulse 1s infinite; }
    .status-dot.done { background: var(--accent3); }
    .status-dot.solved { background: var(--accent); }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.8); }
    }

    .legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--muted);
    }

    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 2px;
    }

    footer {
      margin-top: 20px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <div class="badge"># 99 of 100</div>
  <h1>Maze Generator</h1>
  <p class="subtitle">Recursive Backtracking Algorithm · Animated · Solver</p>
</header>

<div class="app">

  <div class="controls">
    <div class="control-group">
      <label>Size</label>
      <select id="sizeSelect">
        <option value="10">Small (10×10)</option>
        <option value="15" selected>Medium (15×15)</option>
        <option value="20">Large (20×20)</option>
        <option value="30">XL (30×30)</option>
        <option value="40">XXL (40×40)</option>
      </select>
    </div>
    <div class="control-group">
      <label>Speed <span class="range-val" id="speedVal">5</span></label>
      <input type="range" id="speedRange" min="1" max="10" value="5" />
    </div>
  </div>

  <div class="btn-row">
    <button id="btnGenerate" class="btn-primary">⚡ Generate</button>
    <button id="btnSolve" class="btn-teal" disabled>🔍 Solve</button>
    <button id="btnInstant" class="btn-ghost">⬛ Instant</button>
    <button id="btnClear" class="btn-ghost">↺ Reset</button>
  </div>

  <div class="canvas-wrapper">
    <canvas id="mazeCanvas"></canvas>
  </div>

  <div class="status-bar">
    <div class="status-text">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusMsg">Click Generate to create a maze</span>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#10b981"></div> Start</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f43f5e"></div> End</div>
      <div class="legend-item"><div class="legend-dot" style="background:#7c3aed"></div> Solution</div>
    </div>
  </div>

</div>

<footer>Project 99 / 100 &mdash; Built with vanilla JS &amp; Canvas API</footer>

<script>
  const canvas = document.getElementById('mazeCanvas');
  const ctx = canvas.getContext('2d');
  const btnGenerate = document.getElementById('btnGenerate');
  const btnSolve = document.getElementById('btnSolve');
  const btnInstant = document.getElementById('btnInstant');
  const btnClear = document.getElementById('btnClear');
  const sizeSelect = document.getElementById('sizeSelect');
  const speedRange = document.getElementById('speedRange');
  const speedVal = document.getElementById('speedVal');
  const statusDot = document.getElementById('statusDot');
  const statusMsg = document.getElementById('statusMsg');

  let cols, rows, grid, animFrame, running = false;

  const DIRS = [
    { dx: 0, dy: -2, wall: { dx: 0, dy: -1 } },
    { dx: 2, dy: 0,  wall: { dx: 1, dy: 0  } },
    { dx: 0, dy: 2,  wall: { dx: 0, dy: 1  } },
    { dx: -2, dy: 0, wall: { dx: -1, dy: 0 } },
  ];

  function setStatus(msg, state = '') {
    statusMsg.textContent = msg;
    statusDot.className = 'status-dot' + (state ? ' ' + state : '');
  }

  function getCellSize(c) {
    const maxW = Math.min(window.innerWidth - 48, 660);
    return Math.max(4, Math.floor(maxW / c));
  }

  function initGrid(c, r) {
    cols = c; rows = r;
    const cs = getCellSize(c);
    canvas.width  = cols * cs;
    canvas.height = rows * cs;
    canvas._cell  = cs;

    grid = [];
    for (let y = 0; y < rows; y++)
      for (let x = 0; x < cols; x++)
        grid.push({ x, y, wall: true, visited: false, solution: false, current: false });
  }

  function idx(x, y) { return y * cols + x; }
  function cell(x, y) { return grid[idx(x, y)]; }

  function drawCell(c) {
    if (!c || c.x < 0) return;
    const cs = canvas._cell;
    let color;
    if (c.isStart)       color = '#10b981';
    else if (c.isEnd)    color = '#f43f5e';
    else if (c.solution) color = '#6d28d9';
    else if (c.current)  color = '#fbbf24';
    else if (c.wall)     color = c.visited ? '#1e1b4b' : '#0f0c29';
    else                 color = '#0d0d1a';

    ctx.fillStyle = color;
    ctx.fillRect(c.x * cs, c.y * cs, cs, cs);
  }

  function drawAll() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const c of grid) drawCell(c);
    ctx.strokeStyle = 'rgba(124,58,237,0.35)';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, canvas.width - 2, canvas.height - 2);
  }

  // ---- GENERATION: Recursive Backtracking (iterative) ----
  function generate(instant = false) {
    if (running) return;
    cancelAnimationFrame(animFrame);
    running = true;
    btnGenerate.disabled = true;
    btnSolve.disabled = true;
    btnInstant.disabled = true;
    setStatus('Generating maze…', 'running');

    const n = parseInt(sizeSelect.value);
    const c = n % 2 === 0 ? n + 1 : n;
    initGrid(c, c);
    drawAll();

    const start = cell(1, 1);
    start.wall = false;
    start.visited = true;

    const stack = [start];
    const stepsPerFrame = instant ? 1e6 : Math.max(1, parseInt(speedRange.value) * 3);
    let prev = null;

    function step() {
      let steps = 0;
      while (stack.length > 0 && steps++ < stepsPerFrame) {
        const curr = stack[stack.length - 1];

        if (!instant) {
          if (prev && prev !== curr) { prev.current = false; drawCell(prev); }
          curr.current = true;
          drawCell(curr);
          prev = curr;
        }

        const neighbors = [];
        for (const d of DIRS) {
          const nx = curr.x + d.dx, ny = curr.y + d.dy;
          if (nx >= 0 && nx < cols && ny >= 0 && ny < rows) {
            const nc = cell(nx, ny);
            if (!nc.visited) {
              neighbors.push({ nc, wallCell: cell(curr.x + d.wall.dx, curr.y + d.wall.dy) });
            }
          }
        }

        if (neighbors.length > 0) {
          const { nc, wallCell } = neighbors[Math.floor(Math.random() * neighbors.length)];
          wallCell.wall = false;
          wallCell.visited = true;
          nc.wall = false;
          nc.visited = true;
          stack.push(nc);
          if (!instant) { drawCell(wallCell); drawCell(nc); }
        } else {
          stack.pop();
        }
      }

      if (stack.length > 0 && !instant) {
        animFrame = requestAnimationFrame(step);
      } else if (stack.length === 0 || instant) {
        finishGeneration();
      }
    }

    if (instant) {
      step();
    } else {
      animFrame = requestAnimationFrame(step);
    }
  }

  function finishGeneration() {
    running = false;
    // Mark start and end
    cell(1, 1).isStart = true;
    cell(cols - 2, rows - 2).isEnd = true;
    cell(cols - 2, rows - 2).wall = false;
    // Remove current marker
    for (const c of grid) c.current = false;
    drawAll();
    btnGenerate.disabled = false;
    btnSolve.disabled = false;
    btnInstant.disabled = false;
    setStatus(`Maze ready! ${cols}×${rows} — Click Solve to find the path`, 'done');
  }

  // ---- SOLVING: BFS ----
  function solve() {
    if (running) return;
    // Reset solution
    for (const c of grid) { c.solution = false; delete c._bfsVisited; }
    const startC = cell(1, 1);
    const endC = cell(cols - 2, rows - 2);

    running = true;
    btnSolve.disabled = true;
    btnGenerate.disabled = true;
    setStatus('Solving with BFS…', 'running');

    const queue = [[startC]];
    startC._bfsVisited = true;

    const SDIRS = [
      { dx: 0, dy: -1 }, { dx: 1, dy: 0 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 }
    ];

    const stepsPerFrame = Math.max(1, speedRange.value * 3);

    function bfsStep() {
      let steps = 0;
      while (queue.length > 0 && steps++ < stepsPerFrame) {
        const path = queue.shift();
        const curr = path[path.length - 1];

        if (curr === endC) {
          // Draw solution
          for (const c of path) { c.solution = true; }
          drawAll();
          running = false;
          btnGenerate.disabled = false;
          setStatus(`✅ Solved! Path length: ${path.length} steps`, 'solved');
          return;
        }

        for (const d of SDIRS) {
          const nx = curr.x + d.dx, ny = curr.y + d.dy;
          if (nx >= 0 && nx < cols && ny >= 0 && ny < rows) {
            const nc = cell(nx, ny);
            if (!nc.wall && !nc._bfsVisited) {
              nc._bfsVisited = true;
              queue.push([...path, nc]);
            }
          }
        }
      }
      if (queue.length > 0) animFrame = requestAnimationFrame(bfsStep);
      else {
        running = false;
        btnGenerate.disabled = false;
        setStatus('No solution found!', '');
      }
    }

    animFrame = requestAnimationFrame(bfsStep);
  }

  function reset() {
    cancelAnimationFrame(animFrame);
    running = false;
    btnGenerate.disabled = false;
    btnSolve.disabled = true;
    btnInstant.disabled = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    initGrid(1, 1);
    canvas.width = 0; canvas.height = 0;
    setStatus('Click Generate to create a maze', '');
  }

  // ---- Events ----
  btnGenerate.addEventListener('click', () => generate(false));
  btnInstant.addEventListener('click', () => generate(true));
  btnSolve.addEventListener('click', solve);
  btnClear.addEventListener('click', reset);

  speedRange.addEventListener('input', () => {
    speedVal.textContent = speedRange.value;
  });

  // Initial state
  initGrid(1, 1);
  canvas.width = 0; canvas.height = 0;
</script>
</body>
</html>
