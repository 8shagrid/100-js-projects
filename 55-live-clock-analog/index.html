<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Analog Clock - Project 55</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="clock">
            <div class="hand hour" id="hour-hand"></div>
            <div class="hand min" id="min-hand"></div>
            <div class="hand sec" id="sec-hand"></div>
            
            <!-- Dial numbers/markers -->
            <div class="number n12">12</div>
            <div class="number n3">3</div>
            <div class="number n6">6</div>
            <div class="number n9">9</div>
            
            <div class="center-pin"></div>
        </div>

        <div class="digital-time" id="digital-time">00:00:00</div>

        <footer class="project-footer">
            Project 55 / 100 &mdash; Live Clock Analog
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
