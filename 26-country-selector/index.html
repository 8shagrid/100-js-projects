<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Selector - Project 26</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Country Selector</h1>
        <p>Pilih negara Anda:</p>
        
        <div class="custom-select" id="custom-select">
            <div class="select-header" id="select-header">
                <img id="selected-flag" src="" alt="" class="flag-icon" style="display: none;">
                <span id="selected-name">Pilih Negara</span>
                <span class="arrow">▼</span>
            </div>
            <ul class="options-list" id="options-list">
                <!-- Options will be populated by JS -->
            </ul>
        </div>

        <footer class="project-footer">
            Project 26 / 100 &mdash; Country Selector with Flags
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
