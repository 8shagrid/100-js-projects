<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Test - Project 48</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Typing Test</h1>
        
        <div class="stats">
            <div class="stat">
                <span class="label">Time</span>
                <p id="timer">60s</p>
            </div>
            <div class="stat">
                <span class="label">WPM</span>
                <p id="wpm">0</p>
            </div>
            <div class="stat">
                <span class="label">Accuracy</span>
                <p id="accuracy">0%</p>
            </div>
        </div>

        <div class="typing-area" id="typing-area">
            <!-- Text spans will be generated here -->
        </div>
        <input type="text" id="input-field" class="input-field" autofocus>

        <button id="restart-btn" class="restart-btn">Mulai Ulang</button>

        <footer class="project-footer">
            Project 48 / 100 &mdash; Typing Speed Test
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
