<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Meter - Project 21</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Password Strength Meter</h1>
        <p>Ketik kata sandi Anda untuk melihat kekuatannya:</p>
        
        <input type="password" id="password" placeholder="Masukkan kata sandi...">
        
        <div class="strength-meter">
            <div id="strength-bar" class="strength-bar"></div>
        </div>
        
        <p id="strength-text" class="strength-text">Berikan masukan...</p>

        <footer class="project-footer">
            Project 21 / 100 &mdash; Password Strength Meter
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
