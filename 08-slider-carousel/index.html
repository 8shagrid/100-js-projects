<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider / Carousel - Project 08</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Image Slider</h1>
        
        <div class="slider">
            <div class="slides" id="slides">
                <div class="slide"><img src="slide1.png" alt="Slide 1"></div>
                <div class="slide"><img src="slide2.png" alt="Slide 2"></div>
                <div class="slide"><img src="slide3.png" alt="Slide 3"></div>
            </div>
            
            <button class="arrow left" id="left">&lt;</button>
            <button class="arrow right" id="right">&gt;</button>
            
            <div class="dots" id="dots">
                <span class="dot active" data-index="0"></span>
                <span class="dot" data-index="1"></span>
                <span class="dot" data-index="2"></span>
            </div>
        </div>

        <footer class="project-footer">
            Project 08 / 100 &mdash; Slider / Carousel
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
