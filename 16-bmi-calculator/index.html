<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator - Project 16</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>BMI Calculator</h1>
        <p>Hitung Body Mass Index Anda:</p>
        
        <div class="input-group">
            <label for="height">Tinggi Badan (cm):</label>
            <input type="number" id="height" placeholder="Contoh: 170">
        </div>
        
        <div class="input-group">
            <label for="weight">Berat Badan (kg):</label>
            <input type="number" id="weight" placeholder="Contoh: 65">
        </div>
        
        <button class="btn" id="calculate">Hitung BMI</button>
        
        <div class="result-box" id="result-box">
            <h2 id="bmi-value">22.5</h2>
            <p id="bmi-status">Berat Badan Normal</p>
        </div>

        <footer class="project-footer">
            Project 16 / 100 &mdash; BMI Calculator
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
