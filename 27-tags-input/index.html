<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags Input - Project 27</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Tags Input</h1>
        <p>Tekan Enter untuk menambah tag (Maks. 10):</p>
        
        <div class="content">
            <ul id="tags-list"></ul>
            <input type="text" id="tag-input" placeholder="Ketik tag...">
        </div>

        <div class="details">
            <p><span id="remaining">10</span> tag tersisa</p>
            <button id="remove-all">Hapus Semua</button>
        </div>

        <footer class="project-footer">
            Project 27 / 100 &mdash; Tags Input
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
