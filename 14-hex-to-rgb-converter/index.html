<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex to RGB Converter - Project 14</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Hex to RGB Converter</h1>
        <p>Masukkan kode warna Hexadecimal:</p>
        
        <input type="text" id="hex-input" placeholder="#3498DB" maxlength="7">
        
        <div class="result-box">
            <div class="color-preview" id="preview"></div>
            <div class="rgb-output">
                <p>RGB Value:</p>
                <h2 id="rgb-result">rgb(52, 152, 219)</h2>
            </div>
        </div>

        <footer class="project-footer">
            Project 14 / 100 &mdash; Hex to RGB Converter
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
