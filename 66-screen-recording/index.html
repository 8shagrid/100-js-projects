<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Recorder - Project 66</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Screen Recorder</h1>
            <div id="status-bar" class="status-bar">
                <span class="dot"></span>
                <span id="timer">00:00</span>
            </div>
        </header>

        <div class="preview-area">
            <video id="preview-video" autoplay muted></video>
            <div id="placeholder" class="placeholder">
                <p>Klik 'Mulai Rekam' untuk memilih layar</p>
            </div>
        </div>

        <div class="controls">
            <button id="start-btn" class="btn primary">Mulai Rekam</button>
            <button id="stop-btn" class="btn secondary" disabled>Berhenti</button>
            <a id="download-link" class="btn download" style="display: none;">Unduh Hasil</a>
        </div>

        <footer class="project-footer">
            Project 66 / 100 &mdash; Screen Capture & MediaRecorder API
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
